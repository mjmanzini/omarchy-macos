mode = "dark"

# macOS dark appearance. Backgrounds follow Apple's elevated dark surfaces
# (#1c1c1e base, #2c2c2e raised), text is the off-white Apple uses rather than
# pure white, and the accent is dark-mode systemBlue.
accent = "#0a84ff"
selection = "#3a3a3c"
muted = "#48484a"

background = "#1c1c1e"
dark_background = "#141416"
darker_background = "#0c0c0e"
lighter_background = "#2c2c2e"

foreground = "#f5f5f7"
dark_foreground = "#8e8e93"
light_foreground = "#e5e5ea"
bright_foreground = "#ffffff"

# ANSI colours are Apple's dark-mode system colours, which are already tuned
# for legibility on dark surfaces.
red = "#ff453a"
yellow = "#ffd60a"
orange = "#ff9f0a"
green = "#30d158"
cyan = "#64d2ff"
blue = "#0a84ff"
magenta = "#bf5af2"
brown = "#ac8e68"

bright_red = "#ff6961"
bright_yellow = "#ffe066"
bright_green = "#5ce07f"
bright_cyan = "#8fdfff"
bright_blue = "#4aa3ff"
bright_magenta = "#d68cf5"
